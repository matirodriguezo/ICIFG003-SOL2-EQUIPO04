server {
    listen 80;
    server_name localhost;

    # Directorio donde se sirven los archivos compilados de Angular
    root /usr/share/nginx/html;
    index index.html;

    # Proxy inverso: redirige todas las llamadas /api al backend
    # Esto evita problemas de CORS ya que la petición sale del servidor, no del navegador
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # SPA fallback: Angular maneja el routing del lado del cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de seguridad básicas
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
}
